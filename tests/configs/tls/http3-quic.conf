# Provenance: nginx HTTP/3 documentation (https://nginx.org/en/docs/http/ngx_http_v3_module.html)
#             plus the QUIC listen syntax from https://nginx.org/en/docs/http/ngx_http_core_module.html#listen
# Shape: tls-http3-quic — `listen 443 quic` alongside `listen 443 ssl`, Alt-Svc advertisement,
#        http3 directive. Requires nginx >= 1.25 (stock nginx:latest has ngx_http_v3_module).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;

    server_name h3.example.com;
    root /var/www/h3.example.com;

    ssl_certificate     /etc/ssl/certs/h3.example.com.pem;
    ssl_certificate_key /etc/ssl/private/h3.example.com.key;
    ssl_protocols TLSv1.3;

    # Advertise HTTP/3 so clients on the TCP leg can upgrade.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    quic_gso on;

    location / {
        try_files $uri $uri/ =404;
    }
}
