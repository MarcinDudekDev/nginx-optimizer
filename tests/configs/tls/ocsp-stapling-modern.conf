# Provenance: Mozilla SSL Configuration Generator, nginx "modern" + "intermediate" profiles
#             (https://ssl-config.mozilla.org/#server=nginx)
# Shape: tls-ocsp-stapling-hsts — OCSP stapling with a trusted chain and an explicit resolver,
#        session tickets off, HSTS preload. A common "already hardened" starting point.
server {
    listen 80;
    listen [::]:80;
    server_name ssl.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ssl.example.com;
    root /var/www/ssl.example.com;

    ssl_certificate         /etc/ssl/certs/ssl.example.com.pem;
    ssl_certificate_key     /etc/ssl/private/ssl.example.com.key;
    ssl_trusted_certificate /etc/ssl/certs/ssl.example.com.chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / { try_files $uri $uri/ =404; }
}
