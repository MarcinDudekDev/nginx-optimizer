# Provenance: anna152:/etc/nginx/sites-available/sklep.asrowerowy.pl.conf (live)
# Shape: tls-shared-cert-hostname-mismatch — a second hostname served off another site's Certbot
#        cert because Cloudflare runs in Full (non-strict) mode. Plus a plain :80 -> :443 redirect server.
# Adapted: Certbot options/dhparam and conf.d includes dropped so the file parses standalone.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name sklep.asrowerowy.pl;
  root /var/www/sklep.asrowerowy.pl;
  index index.html;

  access_log /var/log/nginx/sklep.asrowerowy.pl.access.log;
  error_log  /var/log/nginx/sklep.asrowerowy.pl.error.log warn;

  # Reuse asrowerowy.pl cert. Cloudflare SSL mode is "Full" (non-strict),
  # so the CF->origin leg accepts this cert despite hostname mismatch.
  ssl_certificate     /etc/letsencrypt/live/asrowerowy.pl/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/asrowerowy.pl/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow" always;

  # Pure static placeholder. No fastcgi_pass = no WordPress, no microcache.
  location / {
    try_files $uri $uri/ =404;
  }

}

server {
  listen 80;
  listen [::]:80;
  server_name sklep.asrowerowy.pl;
  return 301 https://$host$request_uri;
}
