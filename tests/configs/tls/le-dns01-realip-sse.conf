# Provenance: ewa117:/etc/nginx/sites-available/kiedy (live)
# Shape: tls-le-dns01-with-realip — TLSv1.2+1.3 only, shared SSL session cache, Cloudflare real_ip,
#        and a location-scoped SSE stream with a 1h read timeout alongside a normal proxy location.
# Adapted: snippets/cloudflare-realip.conf include dropped so the file parses standalone.
# kiedy.marcindudek.dev — nginx reverse proxy (Cloudflare Full SSL, LE cert via DNS-01)

server {
    listen 80;
    listen [::]:80;
    server_name kiedy.marcindudek.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiedy.marcindudek.dev;

    ssl_certificate     /etc/letsencrypt/live/kiedy.marcindudek.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiedy.marcindudek.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;


    client_max_body_size 64k;
    gzip on;
    gzip_types text/html application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # The live overlap feed. Buffering here would hold every tick until the
    # response ended — which for an SSE stream is never.
    location ~ ^/e/[^/]+/feed$ {
        proxy_pass http://127.0.0.1:8032;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8032;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: real_ip has already
        # resolved it to the visitor, and appending would let a client prepend
        # its own hop and confuse whatever reads the list later.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
