# Provenance: nginx ngx_http_ssl_module docs
#             (https://nginx.org/en/docs/http/ngx_http_ssl_module.html#ssl_verify_client)
# Shape: tls-mutual-auth — client-certificate verification, $ssl_client_* variables forwarded
#        upstream, an optional-verify location alongside a mandatory-verify one. Optimizers that
#        blanket-inject headers must not clobber the client-cert passthrough.
server {
    listen 443 ssl;
    server_name mtls.example.com;

    ssl_certificate     /etc/ssl/certs/mtls.example.com.pem;
    ssl_certificate_key /etc/ssl/private/mtls.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_client_certificate /etc/ssl/certs/internal-ca.pem;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    location / {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    }

    # Health checks are allowed through without a client certificate.
    location = /healthz {
        return 200 'ok';
    }
}
