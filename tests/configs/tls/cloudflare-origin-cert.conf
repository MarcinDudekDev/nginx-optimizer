# Provenance: ivy187:/etc/nginx/sites-available/strzelnicacolt.pl.conf (live)
# Shape: tls-cloudflare-origin-cert — a Cloudflare Origin CA cert (not Let's Encrypt), :80 and :443
#        collapsed into one server, third server_name for a staging host, per-site php-fpm socket.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strzelnicacolt.pl www.strzelnicacolt.pl strzeltest.mythit.com;
    root /var/www/strzelnicacolt.pl/public;
    index index.php index.html;
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64M;
    access_log /var/log/nginx/strzelnicacolt.access.log;
    error_log  /var/log/nginx/strzelnicacolt.error.log;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        # ADAPTED: Debian ships snippets/fastcgi-php.conf; inlined so the file parses standalone.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;
        set $path_info $fastcgi_path_info;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm-strzelnicacolt.pl.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }
    location ~ /\.ht { deny all; }
}
