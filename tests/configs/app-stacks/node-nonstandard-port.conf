# Provenance: frog03:/etc/nginx/http.d/devtools.conf (live)
# Shape: app-node-nonstandard-port — a Node service behind nginx on a non-80/443 Mikrus port,
#        gzip declared per-server, no TLS at all (Cloudflare terminates).
# Adapted: snippets/deny-backups.conf include dropped so the file parses standalone.
server {
    listen 20495;
    listen [::]:20495;
    server_name frog03-20495.wykr.es f3495.mikr.us _;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    gzip on;
    gzip_types text/css application/javascript application/json text/xml application/xml text/plain;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
