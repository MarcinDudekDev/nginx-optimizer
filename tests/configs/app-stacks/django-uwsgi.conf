# Provenance: derived from the uWSGI + nginx documentation
#             (https://uwsgi-docs.readthedocs.io/en/latest/Nginx.html) and the Django deployment docs.
#             DERIVED — the upstream doc splits this across several fragments.
# Shape: app-django-uwsgi — uwsgi_pass over a UNIX socket (not fastcgi, not proxy), /static/ and
#        /media/ served by alias, uwsgi_params include. A detector keyed on fastcgi_pass sees nothing here.
upstream django {
    server unix:/run/uwsgi/django.sock;
}

server {
    listen 80;
    server_name django.example.com;
    charset utf-8;

    client_max_body_size 75M;

    location /media/  { alias /var/www/django/media/;  expires 30d; }
    location /static/ { alias /var/www/django/static/; expires 30d; }

    location / {
        uwsgi_pass  django;
        include     uwsgi_params;
        uwsgi_read_timeout 120s;
    }
}
