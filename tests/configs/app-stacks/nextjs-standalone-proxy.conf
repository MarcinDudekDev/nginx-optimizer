# Provenance: derived from the Next.js self-hosting docs (https://nextjs.org/docs/app/getting-started/deploying)
#             plus the standard nginx proxy recipe for a `next start` server.
#             DERIVED — Next.js ships no canonical nginx file.
# Shape: app-nextjs-immutable-assets — /_next/static served with a one-year immutable cache from the
#        upstream, /_next/image left dynamic, everything else proxied. Long-cache rules that key on
#        file extension miss /_next/static entirely because the hash is in the path, not the suffix.
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name next.example.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
