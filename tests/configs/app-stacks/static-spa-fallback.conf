# Provenance: ivy187:/etc/nginx/sites-available/wearematchify.com.conf (live)
# Shape: app-static-spa-fallback — try_files ... /index.html SPA fallback, per-site log paths under
#        the site root, an `if ($host = www...)` redirect INSIDE the server block, no PHP at all.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wearematchify.com www.wearematchify.com;
    root /var/www/wearematchify.com/placeholder;
    index index.html;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ADAPTED: the original logs under the site root (/var/www/<site>/logs/); repointed to

    # /var/log/nginx so the file parses without pre-creating directories.

    access_log /var/log/nginx/wearematchify.access.log;
    error_log  /var/log/nginx/wearematchify.error.log;

    if ($host = www.wearematchify.com) { return 301 https://wearematchify.com$request_uri; }

    location / { try_files $uri $uri/ /index.html; }
    location ~ /\.ht { deny all; }
}
