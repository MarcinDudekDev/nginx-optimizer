# Provenance: anna152:/etc/nginx/sites-available/marcindudek.dev
# Shape: minimal-static-with-php — static site, long-cache assets, one php location, no TLS

server {
      listen 80;
      listen [::]:80;
      server_name marcindudek.dev www.marcindudek.dev;

      root /var/www/marcindudek.dev;
      index index.html index.htm;

      # 301 redirect: old product URL → SiftX
      location /x-engagement-analyzer/ {
          return 301 /siftx/;
      }

      # Cache static assets
      location ~* \.(webp|jpg|jpeg|png|gif|ico|svg)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      location ~* \.(css|js)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      location ~ \.php$ {
          # ADAPTED: Debian ships snippets/fastcgi-php.conf; inlined so the file parses standalone.
          fastcgi_split_path_info ^(.+\.php)(/.+)$;
          try_files $fastcgi_script_name =404;
          set $path_info $fastcgi_path_info;
          fastcgi_param PATH_INFO $path_info;
          fastcgi_index index.php;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_pass unix:/run/php/php8.4-fpm.sock;
      }

      location / {
          try_files $uri $uri/ =404;
      }
  }
