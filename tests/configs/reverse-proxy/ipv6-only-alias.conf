# Provenance: ewa117:/etc/nginx/sites-available/whydoesmysitesuck (live)
# Shape: proxy-ipv6-only-alias — IPv6-only listen, alias for /static/, SSE, add_header in location

server {
    listen [::]:80;
    server_name whydoesmysitesuck.com www.whydoesmysitesuck.com;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (DataStar)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # Cache control for HTML responses
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /static/ {
        alias /opt/whydoesmysitesuck/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
