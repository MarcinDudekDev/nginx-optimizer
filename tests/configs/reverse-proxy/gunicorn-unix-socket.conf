# Provenance: anna152:/etc/nginx/sites-available/trading.conf (live)
# Shape: proxy-unix-socket — Gunicorn over a UNIX socket, static root split, long timeouts

server {
    listen [::]:80;
    server_name fxtrading.bieda.it;

    # --- Security & basics ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    client_max_body_size 64m;            # bump if you upload large CSVs
    sendfile on;

    # --- Static files (served by Nginx, not Flask) ---
    # Put assets in /var/www/trading/static/...
    location /static/ {
        root /var/www/trading;           # serves /var/www/trading/static/...
        access_log off;
        expires 7d;
    }
    location = /favicon.ico { access_log off; log_not_found off; root /var/www/trading/static; }

    # --- Proxy to Gunicorn (UNIX socket) ---
    location / {
        proxy_http_version 1.1;

        # Forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy CSV processing
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_pass http://unix:/var/www/trading/run/app.sock;
    }
}
