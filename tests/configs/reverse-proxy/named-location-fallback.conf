# Provenance: anna152:/etc/nginx/sites-available/the-throne (live)
# Shape: proxy-named-location-fallback — static-first with @backend named-location fallback,
#        Datastar SSE, deny rules for app internals, http2 on the listen line
# Adapted: Certbot option/dhparam includes dropped so the file parses standalone.

server {
    listen 80;
    listen [::]:80;
    server_name claimthethrone.org www.claimthethrone.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claimthethrone.org www.claimthethrone.org;

    ssl_certificate /etc/letsencrypt/live/claimthethrone.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claimthethrone.org/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive files (defense in depth)
    location ~ /\. { deny all; return 404; }
    location ~ ^/(data|venv|__pycache__|app\.py|requirements\.txt) { deny all; return 404; }

    # Proxy to gunicorn
    location / {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # SSE support (Datastar)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Static files (serve directly, bypass gunicorn)
    location ~* \.(ico|png|svg|webmanifest|jpg|jpeg|gif|css|js|woff2?)$ {
        root /var/www/the-throne/public;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
