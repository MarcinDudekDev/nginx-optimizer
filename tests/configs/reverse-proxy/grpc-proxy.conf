# Provenance: nginx ngx_http_grpc_module docs (https://nginx.org/en/docs/http/ngx_http_grpc_module.html)
# Shape: proxy-grpc — grpc_pass, not proxy_pass. HTTP/2 is mandatory. gzip and add_header rules
#        aimed at HTML break gRPC framing, so a blanket compression/header injection is wrong here.
server {
    listen 50051 http2;
    server_name grpc.example.com;

    access_log /var/log/nginx/grpc.access.log;

    # Route by gRPC service name.
    location /helloworld.Greeter/ {
        grpc_pass grpc://127.0.0.1:50052;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    location / {
        grpc_pass grpc://127.0.0.1:50052;
        error_page 502 = /error502grpc;
    }

    location = /error502grpc {
        internal;
        default_type application/grpc;
        add_header grpc-status 14;
        add_header grpc-message "unavailable";
        return 204;
    }
}
