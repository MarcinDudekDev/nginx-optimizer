# Provenance: anna152:/etc/nginx/sites-available/clickbattle.byst.re (live)
# Shape: proxy-sse — Server-Sent Events: buffering off, chunked off, 600s read timeout,
#        IPv6-only listen (Mikrus), gzip declared inside the server block, large commented SSL block.

# Nginx configuration for Click Battle
# File: /etc/nginx/sites-available/clickbattle.byst.re
#
# IMPORTANT FOR MIKR.US VPS:
# - Must listen on IPv6 ([::]:80) for custom domains
# - Use CloudFlare with SSL/TLS set to "Flexible"
# - Add AAAA DNS record pointing to your server's IPv6

server {
    listen [::]:80;  # IPv6 required for Mikr.us
    server_name clickbattle.byst.re;

    # Logging
    access_log /var/log/nginx/clickbattle_access.log;
    error_log /var/log/nginx/clickbattle_error.log;

    # Main application proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-specific settings (CRITICAL for Server-Sent Events)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Increase timeout for long-lived SSE connections (10 minutes + buffer)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
    }

    # Gzip compression (but not for SSE streams)
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_proxied any;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

