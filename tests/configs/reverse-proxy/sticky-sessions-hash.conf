# Provenance: nginx ngx_http_upstream_module docs
#             (https://nginx.org/en/docs/http/ngx_http_upstream_module.html#hash)
# Shape: proxy-sticky-upstream-hash — consistent hashing on a cookie for session affinity, plus a
#        `down` server and per-server weights. Rewriting upstream blocks must preserve
#        server flags; dropping `down` or a weight changes traffic routing, not just performance.
upstream app_sticky {
    hash $cookie_sessionid consistent;

    server 10.0.0.11:8080 weight=3 max_fails=2 fail_timeout=30s;
    server 10.0.0.12:8080 weight=1 max_fails=2 fail_timeout=30s;
    server 10.0.0.13:8080 down;
    # NOTE: `hash ... consistent` rejects `backup` ("balancing method does not support
    #       parameter backup") — a real constraint any upstream rewriter must respect.

    keepalive 16;
}

server {
    listen 80;
    server_name sticky.example.com;

    location / {
        proxy_pass http://app_sticky;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
