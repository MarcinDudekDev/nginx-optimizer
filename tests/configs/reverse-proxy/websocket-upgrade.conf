# Provenance: nginx WebSocket proxying guide (https://nginx.org/en/docs/http/websocket.html)
# Shape: proxy-websocket-upgrade — the canonical `map $http_upgrade $connection_upgrade` idiom.
#        Injecting `proxy_set_header Connection ""` for upstream keepalive here silently breaks WS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream websocket_backend {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    server_name ws.example.com;

    location /ws/ {
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://websocket_backend;
        proxy_set_header Host $host;
    }
}
