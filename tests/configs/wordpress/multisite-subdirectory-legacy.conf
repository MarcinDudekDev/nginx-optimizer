# Provenance: https://developer.wordpress.org/advanced-administration/server/web-server/nginx/
#             ("WordPress multisite subdirectory config file for WP 3.4 and below")
# Shape: wordpress-multisite-subdir-ms-files — two chained map blocks, an `if (!-e ...)` rewrite
#        block, an `internal` alias location. The rewrite-detection heuristics have to survive this.
# Adapted: the `php` upstream lives in the main config in the source article; inlined here.
upstream php_ms_subdir {
    server unix:/run/php/php-fpm.sock;
}

map $uri $blogname{
    ~^(?P<blogpath>/[^/]+/)files/(.*)       $blogpath ;
}

map $blogname $blogid{
    default -999;
    #Ref: https://wordpress.org/extend/plugins/nginx-helper/
}

server {
    server_name example.com ;

    root /var/www/example.com/htdocs;
    index index.php;

    location ~ ^(/[^/]+/)?files/(.+) {
        try_files /wp-content/blogs.dir/$blogid/files/$2 /wp-includes/ms-files.php?file=$2 ;
        access_log off;     log_not_found off; expires max;
    }

    #avoid php readfile()
    location ^~ /blogs.dir {
        internal;
        alias /var/www/example.com/htdocs/wp-content/blogs.dir ;
        access_log off;     log_not_found off; expires max;
    }

    if (!-e $request_filename) {
        rewrite /wp-admin$ $scheme://$host$request_uri/ permanent;
        rewrite ^(/[^/]+)?(/wp-.*) $2 last;
        rewrite ^(/[^/]+)?(/.*\.php) $2 last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args ;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php_ms_subdir;
    }
}
