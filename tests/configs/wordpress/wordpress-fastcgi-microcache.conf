# Provenance: anna152:/etc/nginx/sites-available/makewpfast.com.conf (live production)
# Shape: wordpress-fastcgi-microcache — microcache with bypass map, disk-served OG images,
#        per-site php-fpm socket, limit_req on PHP, Certbot certs, both :80 and :443 in one server.
# Adapted: the http-context prerequisites this vhost relies on (microcache zone, $mc_* maps,
#          $mwf_cache_control map, mwf_req limit zone) live in conf.d/ on the real host and are
#          inlined below; snippet includes (security headers, ahrefs block, cloudflare realip)
#          are dropped so the file parses standalone.
fastcgi_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=microcache:64m max_size=1g inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=mwf_req:10m rate=20r/s;
map $http_cookie $mc_bypass { default 0; "~*wordpress_logged_in" 1; "~*woocommerce_items_in_cart" 1; }
map $request_uri $mc_eligible { default 1; "~*^/(wp-admin|wp-login|wp-json|cart|checkout|my-account)" 0; }
map $upstream_cache_status $mwf_cache_control { default "public, max-age=0, s-maxage=300"; "HIT" "public, max-age=60, s-maxage=600"; }

# Redirect www to non-www
server {
  listen 80;
  listen [::]:80;
  server_name www.makewpfast.com;
  return 301 https://makewpfast.com$request_uri;
}

server {
  server_name makewpfast.com www.makewpfast.com;

  # og-image-cache-bypass: serve cached OG images directly from disk.
  # Cache files written by mu-plugins/mwf-og-images.php to /wp-content/og-cache/{id}.png|.webp.
  # PHP only runs on cache miss. Massive load drop under crawler bursts.
  location ~ ^/og-image/(\d+)\.png$ {
    try_files /wp-content/og-cache/$1.png @og_php;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-OG-Cache "DISK" always;
  }
  location ~ ^/og-image/(\d+)\.webp$ {
    try_files /wp-content/og-cache/$1.webp @og_php;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-OG-Cache "DISK" always;
  }
  location @og_php {
    rewrite ^/og-image/(\d+)\.(png|webp)$ /index.php?mwf_og_image=$1&mwf_og_format=$2 last;
  }
  root /var/www/makewpfast.com;
  index index.php index.html;
  access_log /var/log/nginx/makewpfast.com.access.log;
  error_log  /var/log/nginx/makewpfast.com.error.log warn;
  client_max_body_size 64M;

  set $skip_cache 0;
  if ($mc_eligible = 0) { set $skip_cache 1; }
  if ($mc_bypass   = 1) { set $skip_cache 1; }
  if ($request_method != GET) { set $skip_cache 1; }
  if ($request_uri ~* "^/(lab|demo)/") { set $skip_cache 1; }

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|ttf|otf|woff|woff2)$ {
    expires 30d; access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php/php8.4-fpm-makewpfast.com.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_param PATH_INFO $fastcgi_path_info;

    fastcgi_buffer_size 64k;
    fastcgi_buffers 8 64k;
    fastcgi_busy_buffers_size 128k;

    fastcgi_cache microcache;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_bypass $skip_cache;
    fastcgi_no_cache   $skip_cache;
    fastcgi_cache_valid 200 301 302 24h;
    fastcgi_cache_valid 404 1s;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 10s;
    fastcgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
    fastcgi_cache_background_update on;
    limit_req zone=mwf_req burst=40 nodelay;
    fastcgi_read_timeout 300;
    add_header X-Micro-Cache $upstream_cache_status always;
    add_header Cache-Control $mwf_cache_control;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~* /(\.git|\.env|composer\.(json|lock)) { deny all; }
  location ~* ^/(cache|logs|config)(/|$) { deny all; }
  location ~* /wp-content/(backup|backups|debug\.log) { deny all; }


  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/makewpfast.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/makewpfast.com/privkey.pem;
}
