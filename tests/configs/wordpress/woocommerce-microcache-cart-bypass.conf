# Provenance: anna152:/etc/nginx/sites-available/asrowerowy.pl.conf (live production WooCommerce)
# Shape: woocommerce-microcache-cart-bypass — cart/checkout cookie bypass, country-keyed cache,
#        stale-while-revalidate, Certbot-managed TLS + separate :80 redirect server.
# Adapted: http-context prerequisites (microcache zone, $mc_*/$req_path/$cache_args_suffix maps)
#          inlined; snippet and Certbot option includes dropped so the file parses standalone.
fastcgi_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=microcache:64m max_size=1g inactive=24h use_temp_path=off;
map $http_cookie $mc_bypass { default 0; "~*wordpress_logged_in" 1; }
map $request_uri $mc_eligible { default 1; "~*^/(wp-admin|wp-login|cart|checkout|my-account)" 0; }
map $request_uri $req_path { default $request_uri; "~^(?<p>[^?]*)" $p; }
map $args $cache_args_suffix { default "?$args"; "" ""; }

server {
  server_name asrowerowy.pl www.asrowerowy.pl;
  root /var/www/asrowerowy.pl;
  index index.php index.html;
  access_log /var/log/nginx/asrowerowy.pl.access.log;
  error_log  /var/log/nginx/asrowerowy.pl.error.log warn;
  client_max_body_size 1024M;

  set $skip_cache 0;
  if ($mc_eligible = 0) { set $skip_cache 1; }
  if ($mc_bypass   = 1) { set $skip_cache 1; }
  if ($request_method != GET) { set $skip_cache 1; }

  # --- sklep.asrowerowy.pl 301 redirects (kill 404s, pass equity) 2026-06-08 ---
  location ~ ^/sklep/?$ { return 301 https://sklep.asrowerowy.pl/; }
  location ~ ^/co-znajduje-sie-w-sklepie/?$ { return 301 https://sklep.asrowerowy.pl/; }

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|ttf|otf|woff|woff2)$ {
    expires 30d; access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php/php8.4-fpm-asrowerowy.pl.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_param PATH_INFO $fastcgi_path_info;

    fastcgi_buffer_size 128k;
    fastcgi_buffers 16 128k;
    fastcgi_busy_buffers_size 256k;

    fastcgi_cache microcache;
    fastcgi_cache_key "$scheme$request_method$host$req_path$cache_args_suffix|$http_cf_ipcountry";
    if ($cookie_woocommerce_items_in_cart) { set $skip_cache 1; }
    if ($cookie_woocommerce_cart_hash) { set $skip_cache 1; }
    fastcgi_cache_bypass $skip_cache;
    fastcgi_no_cache   $skip_cache;
    fastcgi_cache_valid 200 301 302 10m;
    fastcgi_cache_valid 404 1s;
    fastcgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;
    fastcgi_read_timeout 300;
    add_header X-Micro-Cache $upstream_cache_status always;
  }

  location ~* /(\.git|\.env|backup|cache|logs|config|composer\.(json|lock)) { deny all; }


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/asrowerowy.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/asrowerowy.pl/privkey.pem; # managed by Certbot


}
server {
    if ($host = www.asrowerowy.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = asrowerowy.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80; listen [::]:80;
  server_name asrowerowy.pl www.asrowerowy.pl;
    return 404; # managed by Certbot
}
