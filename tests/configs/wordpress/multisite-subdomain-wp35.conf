# Provenance: https://developer.wordpress.org/advanced-administration/server/web-server/nginx/
#             ("WordPress multisite subdomain config file for WP 3.5 and up")
# Shape: wordpress-multisite-subdomain — wildcard server_name, no rewrite block
# Adapted: the `php` upstream lives in the main config in the source article; inlined here.
upstream php_ms_subdomain {
    server unix:/run/php/php-fpm.sock;
}

server {
    server_name example.com *.example.com ;

    root /var/www/example.com/htdocs;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args ;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php_ms_subdomain;
    }

    #add some rules for static content expiry-headers here
}
