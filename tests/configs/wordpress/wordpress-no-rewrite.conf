# WordPress config MISSING the permalink front controller (no try_files).
# On modern nginx (no .htaccess), pretty permalinks return 404 here.
# Used to test detection + optional --add-wp-rewrite injection.

server {
    listen 80;
    server_name norewrite.example.com;
    root /var/www/norewrite.example.com/public_html;
    index index.php index.html;

    access_log /var/log/nginx/norewrite.access.log;
    error_log /var/log/nginx/norewrite.error.log;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
