# Provenance: ewa117:/etc/nginx/sites-available/hunazo (live)
# Shape: wordpress-behind-ipv6-proxy — WP served by a container over IPv6 loopback, two vhosts
# Adapted: nginx-optimizer template includes dropped so the file parses standalone.

server {
    listen [::]:80;
    server_name hunazo.com;

    location / {
        proxy_pass http://[::1]:20117;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen [::]:80;
    server_name demo.hunazo.com;

    location / {
        proxy_pass http://[::1]:30117;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
