# Provenance: derived from the Roots Bedrock deployment docs (https://roots.io/bedrock/docs/)
#             and the Trellis nginx site template (https://github.com/roots/trellis).
#             DERIVED, not a byte-for-byte copy — the Trellis original is an Ansible/Jinja template.
# Shape: wordpress-bedrock — document root is web/ not the project root, wp/ core subdirectory,
#        .env sits one level ABOVE the web root. Optimizers that assume root == WP core break here.
server {
    listen 80;
    server_name bedrock.example.com;

    # The web root is web/, NOT the project root. /var/www/bedrock/.env is deliberately outside it.
    root /var/www/bedrock/web;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # WP core lives under web/wp/, so wp-admin and wp-login resolve one level deeper.
    location /wp/ {
        try_files $uri $uri/ /wp/index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
