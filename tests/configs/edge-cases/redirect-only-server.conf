# Provenance: ewa117:/etc/nginx/sites-available/coopgame-byst-redirect (live)
# Shape: edge-redirect-only — a server block with no root, no location, only a 301. Optimizers that
#        assume every server serves content mis-handle this one.

server {
    listen 80;
    listen [::]:80;
    server_name coopgame.byst.re;
    return 301 https://coopgame-game.marcindudek.dev$request_uri;
}
