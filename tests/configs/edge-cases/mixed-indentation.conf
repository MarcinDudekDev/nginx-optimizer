# Provenance: crafted regression fixture
# Shape: edge-mixed-indentation — tabs, 2-space, 4-space and 8-space indentation in one file, plus
# directives crammed onto one line and a brace on its own line. Indentation-sensitive rewriting breaks here.
server {
	listen 8084;
	server_name	mixed.example.com;
  root /var/www/mixed;
        index index.html index.htm;

    location / { try_files $uri $uri/ =404; }
	location = /health
	{
		return 200 'ok';
	}
  location ~* \.(png|jpg)$ { expires 30d; access_log off; }
}
