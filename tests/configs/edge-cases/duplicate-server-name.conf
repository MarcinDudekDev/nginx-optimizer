# Provenance: crafted regression fixture
# Shape: edge-duplicate-server-name — two server blocks claim the same server_name on the same
#        listen. nginx accepts this with a "conflicting server name" WARNING and silently uses the
#        first. Any tool that reports "one server block per name" is wrong on this file.
server {
    listen 8081;
    server_name dupe.example.com;
    root /var/www/first;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 8081;
    server_name dupe.example.com;
    root /var/www/second;
    location / { return 200 'second'; }
}
