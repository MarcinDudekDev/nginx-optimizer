# Provenance: crafted regression fixture (CRLF written deliberately)
# Shape: edge-crlf-line-endings — every line ends CRLF, as produced by editing a config on Windows
# or pulling it out of a panel's web editor. sed/awk rewriters that anchor on '$' see a stray \r and
# either fail to match or append after it, producing "add_header X ...\r;" which nginx rejects.
server {
    listen 8083;
    server_name crlf.example.com;
    root /var/www/crlf;

    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        access_log off;
    }
}
