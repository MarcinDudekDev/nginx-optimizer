# Provenance: crafted regression fixture
# Shape: edge-deeply-nested-locations — nested location blocks four levels deep, plus an `if` inside
#        a location inside a location. A line-oriented injector that counts braces naively will
#        inject into the wrong scope here.
server {
    listen 8082;
    server_name nested.example.com;
    root /var/www/nested;

    location /a/ {
        add_header X-Level "a" always;

        location /a/b/ {
            add_header X-Level "a-b" always;

            location /a/b/c/ {
                add_header X-Level "a-b-c" always;

                location ~ ^/a/b/c/d/.*\.json$ {
                    add_header X-Level "a-b-c-d" always;
                    default_type application/json;
                    return 200 '{"depth":4}';
                }
            }

            location = /a/b/exact {
                if ($request_method = POST) { return 405; }
                return 200 'exact';
            }
        }
    }

    location / { return 404; }
}
