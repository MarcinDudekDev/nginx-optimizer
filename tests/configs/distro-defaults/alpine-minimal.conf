# Provenance: frog03 (Mikrus Frog, 256MB Alpine):/etc/nginx/nginx.conf
# Shape: distro-default-alpine — http.d/ instead of conf.d/, tiny worker_connections, trailing whitespace

user nginx;
worker_processes 1;
pid /run/nginx.pid;   # ADAPTED: Alpine ships /run/nginx/; flattened so the file parses in a bare container
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 128;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    
    # Logging
    access_log /var/log/nginx/access.log;
    
    include /etc/nginx/http.d/*.conf;
}
