events { worker_connections 1024; }
http {
    fastcgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=WORDPRESS:10m max_size=64m;
    map $request_method $skip_cache {
        default 0;
        POST    1;
    }
    server {
        listen 80;
        server_name localhost;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
@INCLUDE@
        }
        location / { return 200 'ok'; }
    }
}
