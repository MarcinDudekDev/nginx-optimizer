# Security Rate Limiting Zones (HTTP Context)
# Include this in nginx.conf http{} block or conf.d/
#
# Under DDoS or heavy load, excess requests get 429 (Too Many Requests)
# instead of nginx default 503 (which looks like "server down" to monitoring).

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Connection limiting — caps concurrent connections per IP
# Prevents a single IP from exhausting worker_connections
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_conn_zone $server_name zone=perserver:10m;

# Return 429 (not 503) when rate/connection limits are hit
# 503 = "server broken" (triggers alerts), 429 = "slow down" (expected under load)
limit_req_status 429;
limit_conn_status 429;

# Don't log rate-limited requests at error level (floods logs during DDoS)
# They still appear in access log with status 429
limit_req_log_level warn;
limit_conn_log_level warn;
