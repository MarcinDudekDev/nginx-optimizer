# Log Tuning Configuration
# This file goes in conf.d/ (http context)
#
# Custom log format with upstream timing metrics for performance analysis.
# Buffered writes reduce disk I/O from logging on high-traffic sites.
#
# Fields: time, remote_addr, method, uri, status, bytes, referer, ua,
#         request_time, upstream_connect_time, upstream_header_time,
#         upstream_response_time, cache_status

log_format timed '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'rt=$request_time '
                 'uct="$upstream_connect_time" '
                 'uht="$upstream_header_time" '
                 'urt="$upstream_response_time" '
                 'cs=$upstream_cache_status';

# Buffered access logging (reduces disk writes significantly)
# buffer=32k: accumulates up to 32KB before flushing
# flush=5s: force flush every 5 seconds even if buffer not full
# Use in server blocks: access_log /var/log/nginx/access.log timed buffer=32k flush=5s;
