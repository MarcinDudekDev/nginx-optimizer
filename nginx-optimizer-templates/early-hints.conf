# Early Hints (HTTP 103) Configuration
# Include this in server blocks to enable Early Hints forwarding
#
# Requires: nginx >= 1.29.0 (early_hints directive added in nginx 1.29.0)
#
# What it does:
#   - Forwards 103 Early Hints responses from upstream (PHP-FPM, proxy)
#     to the client BEFORE the final 200 response
#   - Browser can start preloading critical CSS/JS while PHP is still
#     rendering the page, improving LCP on dynamic WordPress pages
#
# How to use:
#   - PHP/WordPress must emit 103 with Link: rel=preload headers,
#     e.g. via a plugin or custom mu-plugin:
#
#     header('Link: </wp-content/themes/x/style.css>; rel=preload; as=style', false);
#     header('Link: </wp-content/themes/x/main.js>; rel=preload; as=script', false);
#     headers_send(103);
#
#   - With FastCGI cache, hints are cached and served from cache (free win)
#
# Notes:
#   - Safe to enable even when no upstream sends 103 (no-op fallback)
#   - Works with HTTP/2 and HTTP/3; older HTTP/1.1 clients ignore 103

early_hints on;
