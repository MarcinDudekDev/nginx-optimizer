# DDoS Protection - Server Context
# Include this in server blocks for connection-level protection
#
# Works alongside security-http.conf (which defines the zones).
# These directives enforce the limits at the server block level.

# Limit concurrent connections per IP (prevents socket exhaustion)
# A normal browser uses 6-10 connections; 50 is generous
limit_conn addr 50;

# Limit total concurrent connections per server
# Prevents total connection pool exhaustion under DDoS
# Tune this based on expected legitimate traffic
limit_conn perserver 10000;

# Apply general rate limiting to all requests
# burst=20 allows short spikes (e.g., page with 20 assets)
# nodelay = serve burst immediately, don't queue
limit_req zone=general burst=20 nodelay;

# Stricter rate limiting on login/auth endpoints
location = /wp-login.php {
    limit_req zone=login burst=3 nodelay;
    limit_conn addr 5;
}

location = /xmlrpc.php {
    # xmlrpc is the #1 brute force target — very strict
    limit_req zone=login burst=1 nodelay;
    limit_conn addr 2;
}
