# Bad Bot Blocker Configuration
# This file goes in conf.d/ (http context)
#
# Maps user-agent strings to block known vulnerability scanners,
# aggressive crawlers, and scraper bots. Returns 444 (connection
# closed with no response) for matched bots.
#
# Source: aggregated from common bot lists + easyinstallvps project

map $http_user_agent $bad_bot {
    default 0;

    # Vulnerability scanners
    ~*nikto           1;
    ~*sqlmap          1;
    ~*nessus          1;
    ~*openvas         1;
    ~*burpsuite       1;
    ~*nmap            1;
    ~*masscan         1;
    ~*zgrab           1;
    ~*nuclei          1;
    ~*wpscan          1;
    ~*dirbuster       1;
    ~*gobuster        1;
    ~*httpx           1;

    # Aggressive SEO crawlers (comment out any you actually use)
    ~*AhrefsBot       1;
    ~*SemrushBot      1;
    ~*MJ12bot         1;
    ~*DotBot          1;
    ~*BLEXBot         1;
    ~*PetalBot        1;
    ~*Bytespider      1;

    # Scraping / automation tools
    ~*python-requests 1;
    ~*python-urllib    1;
    ~*Go-http-client  1;
    ~*libwww-perl     1;
    ~*Scrapy          1;
    ~*curl/           1;
    ~*wget/           1;
    ~*HttpClient      1;
    ~*Java/           1;
    ~*fetch/          1;

    # Known bad actors
    ~*360Spider       1;
    ~*Baiduspider     1;
    ~*YandexBot       1;

    # Empty user-agent (almost always bots)
    ""                1;
}
