# Static Assets - Bypass Rate Limiting
# Include in server block BEFORE the general rate limiting location
# These files don't need rate limiting - they're cached and not a security risk

# CSS, JS - versioned assets, cache aggressively
location ~* \.(css|js|mjs|jsx|ts|tsx)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# Images - long cache with stale-while-revalidate
location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|bmp|tiff)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# Fonts - immutable, very long cache
location ~* \.(woff|woff2|ttf|otf|eot)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}

# Media/downloads - moderate cache
location ~* \.(mp4|webm|ogg|mp3|wav|pdf|zip|gz|tar|rar)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    access_log off;
}

# WordPress static assets paths - explicit bypass
location ~* ^/wp-content/.*\.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400, immutable";
    access_log off;
}

location ~* ^/wp-includes/.*\.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400, immutable";
    access_log off;
}
