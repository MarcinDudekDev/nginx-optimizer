# FastCGI Cache Purge - Location Block
# Include this in server blocks alongside FastCGI cache configuration
#
# Enables cache purging via the Nginx Helper WordPress plugin.
# When a post is updated, the plugin sends a PURGE request to clear
# that URL's cached version.
#
# Requires: ngx_cache_purge module (included in nginx-extras package)
# WordPress: Install "Nginx Helper" plugin, enable "purge" method

location ~ /purge(/.*) {
    # Restrict purge to localhost and private networks only
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    fastcgi_cache_purge WORDPRESS "$scheme$request_method$host$1";
}
